<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#374151" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <style>
    .code-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans-font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.15); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes scanLight {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
    
    .orb-1 { animation: pulseOrb 6s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 8s ease-in-out infinite reverse; transform-origin: 1000px 250px; }
    .card-anim-1 { animation: floatCard 4s ease-in-out infinite; }
    .card-anim-2 { animation: floatCard 5s ease-in-out 1s infinite; }
    .flow-path { stroke-dasharray: 12, 8; animation: flowLine 15s linear infinite; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Animated Glowing Background Orbs -->
  <circle class="orb-1" cx="180" cy="90" r="140" fill="#38bdf8" filter="url(#softGlow)" />
  <circle class="orb-2" cx="1020" cy="270" r="160" fill="#a855f7" filter="url(#softGlow)" />
  <circle cx="600" cy="180" r="120" fill="#6366f1" opacity="0.15" filter="url(#softGlow)" />

  <!-- Subtle Blueprint Tech Grid Overlay -->
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Decorative Connecting Circuit Lines (Background) -->
  <path class="flow-path" d="M 50 180 Q 300 80, 550 180 T 1150 180" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.4" />
  <path class="flow-path" d="M 100 280 Q 400 340, 700 240 T 1100 120" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />

  <!-- Dynamic Pill Badges Floating on Sides (Low z-index background) -->
  <g class="card-anim-1" opacity="0.85">
    <!-- GET Badge -->
    <rect x="80" y="55" width="105" height="36" rx="18" fill="#1e293b" stroke="#059669" stroke-width="1.5" />
    <circle cx="98" cy="73" r="5" fill="#10b981" />
    <text x="114" y="78" fill="#34d399" class="code-font" font-size="13" font-weight="700">GET 200</text>
  </g>

  <g class="card-anim-2" opacity="0.85">
    <!-- POST Badge -->
    <rect x="1000" y="60" width="115" height="36" rx="18" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="1018" cy="78" r="5" fill="#3b82f6" />
    <text x="1034" y="83" fill="#60a5fa" class="code-font" font-size="13" font-weight="700">POST 201</text>
  </g>

  <g class="card-anim-1" opacity="0.85">
    <!-- GraphQL Pill -->
    <rect x="90" y="270" width="130" height="36" rx="18" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
    <circle cx="108" cy="288" r="5" fill="#f43f5e" />
    <text x="124" y="293" fill="#fb7185" class="code-font" font-size="13" font-weight="700">GraphQL / REST</text>
  </g>

  <g class="card-anim-2" opacity="0.85">
    <!-- Latency Pill -->
    <rect x="980" y="265" width="135" height="36" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="998" cy="283" r="5" fill="#f59e0b" />
    <text x="1014" y="288" fill="#fbbf24" class="code-font" font-size="13" font-weight="700">⚡ 12ms Mock</text>
  </g>

  <!-- Central Foreground Content Card (Shields Title & Subtitle from clutter) -->
  <rect x="220" y="45" width="760" height="270" rx="20" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5" filter="url(#glow)" opacity="0.95" />

  <!-- Top Terminal Header Dots inside Central Card -->
  <circle cx="255" cy="72" r="6" fill="#ef4444" />
  <circle cx="275" cy="72" r="6" fill="#f59e0b" />
  <circle cx="295" cy="72" r="6" fill="#10b981" />
  <text x="320" y="76" fill="#6b7280" class="code-font" font-size="12">awesome-api-testing-tools // v2026</text>

  <!-- Center Decorative Glow Line -->
  <line x1="250" y1="95" x2="950" y2="95" stroke="#374151" stroke-width="1" />

  <!-- MAIN TITLE (Foreground, Crisp, Unobscured) -->
  <text x="600" y="160" text-anchor="middle" class="sans-font" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5">
    AWESOME API TESTING TOOLS
  </text>

  <!-- SUBTITLE (Foreground, High Contrast) -->
  <text x="600" y="202" text-anchor="middle" class="sans-font" font-size="19" font-weight="500" fill="#e2e8f0">
    Curated SaaS Platforms, HTTP Debuggers &amp; Local-First Open-Source Suites
  </text>

  <!-- TAGLINE PILLS (Bottom inside Card) -->
  <g transform="translate(300, 235)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="115" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <text x="57" y="19" text-anchor="middle" class="code-font" font-size="11" font-weight="600" fill="#a5b4fc">REST &amp; GraphQL</text>

    <!-- Pill 2 -->
    <rect x="125" y="0" width="110" height="30" rx="15" fill="#0f2b38" stroke="#0ea5e9" stroke-width="1" />
    <text x="180" y="19" text-anchor="middle" class="code-font" font-size="11" font-weight="600" fill="#7dd3fc">gRPC &amp; WS</text>

    <!-- Pill 3 -->
    <rect x="245" y="0" width="130" height="30" rx="15" fill="#2d1537" stroke="#d946ef" stroke-width="1" />
    <text x="310" y="19" text-anchor="middle" class="code-font" font-size="11" font-weight="600" fill="#f0abfc">Local-First / Git</text>

    <!-- Pill 4 -->
    <rect x="385" y="0" width="125" height="30" rx="15" fill="#062e24" stroke="#10b981" stroke-width="1" />
    <text x="447" y="19" text-anchor="middle" class="code-font" font-size="11" font-weight="600" fill="#6ee7b7">Traffic Mocking</text>
  </g>
</svg>
